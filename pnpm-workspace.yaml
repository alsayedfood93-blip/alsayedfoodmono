packages:
  - "apps/*"
  - "packages/*"

shamefullyHoist: false

publicHoistPattern:
  - "*prisma*"
  - "*eslint*"
  - "@prisma/*"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true
  "@scarf/scarf": true
  esbuild: true
  bcrypt: true
